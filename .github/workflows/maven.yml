name: developers-stack-api
on:
  push:
    branches: [ "master" ]
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests
      - name: Stop existing instance
        run: |
          PID=$(sudo lsof -t -i:8081) && sudo kill -9 $PID || echo "No process on port 8081"
      - name: Start Jar File
        run: |
          sudo mkdir -p /root/developersstack
          sudo bash -c '
            nohup java -jar \
              /root/actions-runner/_work/POS-ALL-IN-ONE/POS-ALL-IN-ONE/target/POS-0.0.1-SNAPSHOT.jar \
              > /root/developersstack/app.log 2>&1 &
            echo "App started, PID: $!"
          '
