name: developers-stack-api
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests
      - name: Stop existing instance
        run: |
          PID=$(sudo lsof -t -i:8081) && sudo kill -9 $PID || echo "No process on port 8081"
      - name: Start Jar File
        run: |
          nohup sudo java -jar \
            /root/developersstack/actions-runner/_work/developers-stack-api/developers-stack-api/target/developers-stack-api-0.0.1-SNAPSHOT.jar \
            > /root/developersstack/app.log 2>&1 &
          echo "App started, PID: $!"
